<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>T-Bingo Live</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; padding-top: 140px; margin: 0; user-select: none; }
        .header { position: fixed; top: 0; width: 100%; background: #16213e; padding: 10px 0; text-align: center; border-bottom: 4px solid #e94560; z-index: 1000; }
        .min-btn { position: absolute; left: 15px; top: 15px; background: rgba(233, 69, 96, 0.2); border: 1px solid #e94560; color: white; border-radius: 8px; padding: 6px 12px; font-weight: bold; font-size: 0.7rem; }
        .recent-container { display: flex; justify-content: center; gap: 8px; margin-top: 8px; height: 40px; align-items: center; }
        .ball { width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #feb155, #e94560); color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: 0 4px 8px rgba(0,0,0,0.4); animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .ball.recent { width: 46px; height: 46px; background: radial-gradient(circle at 30% 30%, #ff7e67, #ff007f); font-size: 1.4rem; border: 2px solid #fff; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 92%; max-width: 360px; background: #16213e; padding: 10px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .cell { aspect-ratio: 1; background: #0f3460; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; cursor: pointer; border: 1px solid #1a1a2e; transition: all 0.1s linear; color: #e2e2e2; }
        .cell.marked { background: #e94560 !important; color: white !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); transform: scale(0.96); border-color: #fff; }
        .cell.free-cell { background: #233e5b; color: #feb155; font-size: 0.8rem; }
        .btn-claim { margin-top: 25px; width: 85%; max-width: 300px; padding: 14px; background: linear-gradient(45deg, #ff7e67, #e94560); border: none; color: white; font-weight: bold; font-size: 1.3rem; border-radius: 10px; box-shadow: 0 6px 12px rgba(233,69,96,0.4); cursor: pointer; letter-spacing: 1px; }
        .btn-claim:disabled { background: #555 !important; box-shadow: none !important; cursor: not-allowed; }
        .room-indicator { font-size: 0.8rem; color: #00fff0; letter-spacing: 1px; margin-top: 4px; font-weight: bold; text-transform: uppercase; }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="header">
        <button class="min-btn" onclick="tg.close();">❌ CLOSE</button>
        <div id="call-status" style="font-size: 1.3rem; font-weight: bold; color: #feb155;">WAITING FOR DRAW...</div>
        <div id="room-title" class="room-indicator">ROOM: -</div>
        <div class="recent-container" id="recent-balls"></div>
    </div>

    <div class="grid" id="bingo-grid"></div>

    <button class="btn-claim" id="bingo-btn" onclick="claimBingo();">BINGO!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const myUid = params.get('user_id') || '0';
        
        // FIX TASK 3: Verify room_id travels completely into the client system framework
        const myRoom = params.get('room_id') || 'beginner';
        const mySession = params.get('session_id') || '';
        
        // FIX TASK 2: Dynamic fallback implementation pointing exactly to the verified Ngrok gateway parameter
        const API_URL = params.get('api_url') || 'http://127.0.0.1:5000';

        document.getElementById('room-title').innerText = `ROOM: ${myRoom}`;

        let cardMatrix = [];
        let numbersCalled = [];

        async function loadBoard() {
            try {
                const response = await fetch(`${API_URL}/get_card`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: myUid, room_id: myRoom, session_id: mySession })
                });
                const data = await response.json();
                if(data.status === "success") {
                    cardMatrix = data.card;
                    renderGrid();
                } else {
                    tg.showAlert("Initialization Error: " + data.message);
                }
            } catch(e) {
                tg.showAlert("Failed to connect to streaming API backend channels.");
            }
        }

        function renderGrid() {
            const container = document.getElementById('bingo-grid');
            container.innerHTML = "";
            
            // Transpose columns layout array structure securely to standard visual rows format grids mapping matching views
            for(let r = 0; r < 5; r++) {
                for(let c = 0; c < 5; c++) {
                    const cellVal = cardMatrix[c][r];
                    const div = document.createElement('div');
                    div.className = "cell";
                    div.innerText = cellVal;
                    
                    if(cellVal === "FREE") {
                        div.classList.add("free-cell", "marked");
                        div.innerText = "FREE";
                    } else {
                        div.onclick = () => {
                            if(numbersCalled.includes(parseInt(cellVal))) {
                                div.classList.toggle('marked');
                            } else {
                                tg.showAlert("Number not drawn yet! | ቁጥሩ እስካሁን አልተጠራም !");
                            }
                        };
                    }
                    container.appendChild(div);
                }
            }
        }

        async function updateDraws() {
            try {
                const response = await fetch(`${API_URL}/get_numbers?room_id=${myRoom}&session_id=${mySession}`);
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('call-status').innerText = "SESSION ERROR";
                    return;
                }
                
                numbersCalled = data.called || [];
                
                if(numbersCalled.length > 0) {
                    const lastNum = numbersCalled[numbersCalled.length - 1];
                    const letter = lastNum <= 15 ? "B" : (lastNum <= 30 ? "I" : (lastNum <= 45 ? "N" : (lastNum <= 60 ? "G" : "O")));
                    document.getElementById('call-status').innerText = `${letter} — ${lastNum}`;
                    
                    // Render historical track sequences
                    const track = document.getElementById('recent-balls');
                    track.innerHTML = "";
                    const history = numbersCalled.slice(-4).reverse();
                    history.forEach((num, idx) => {
                        const b = document.createElement('div');
                        b.className = idx === 0 ? "ball recent" : "ball";
                        b.innerText = num;
                        track.appendChild(b);
                    });
                }
                
                if(!data.game_active) {
                    document.getElementById('bingo-btn').disabled = true;
                } else if(data.paused) {
                    document.getElementById('call-status').innerText = "⏸ PAUSED FOR VERIFICATION";
                    document.getElementById('bingo-btn').disabled = true;
                } else {
                    document.getElementById('bingo-btn').disabled = false;
                }
            } catch(e) {
                console.error("Tracking connection dropped stream sync loops.", e);
            }
        }

        async function claimBingo() {
            const btn = document.getElementById('bingo-btn');
            btn.disabled = true;
            btn.innerText = "VERIFYING...";

            const marked = Array.from(document.querySelectorAll('.cell.marked')).map(c => c.innerText);
            
            const userName = tg.initDataUnsafe.user?.username || tg.initDataUnsafe.user?.first_name || "Player";

            try {
                const res = await fetch(`${API_URL}/claim_bingo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user: userName,
                        user_id: myUid,
                        room_id: myRoom,
                        session_id: mySession,
                        numbers: marked
                    })
                });

                const result = await res.json();
                tg.showAlert(result.status === "success" ? "🏆 BINGO Sent!" : "❌ " + result.message);

                if (result.status !== "success") {
                    btn.disabled = false;
                    btn.innerText = "BINGO!";
                }
            } catch (e) {
                tg.showAlert("Connection Error");
                btn.disabled = false;
                btn.innerText = "BINGO!";
            }
        }

        loadBoard();
        setInterval(updateDraws, 3000);
    </script>
</body>
</html>
